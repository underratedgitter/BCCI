# DISABLED — this workflow published the portal to GitHub Pages.
#
# GitHub Pages serves static files only: it cannot run the serverless
# functions in /api, so on the Pages copy every /api/* request returned 404
# and OTP sign-in, application submission, the enquiry form and the admin
# portal were all dead. vercel.json (CSP and the other security headers) was
# ignored there too.
#
# The portal is hosted on Vercel, which runs the API. Running both meant the
# public URL was the broken one.
#
# The trigger is now manual-only, so a push to main no longer republishes the
# broken copy. To retire it for good, delete this file. To bring Pages back
# (only sensible for a genuinely static site), restore the `push` trigger.

name: Deploy static content to Pages (disabled)

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
