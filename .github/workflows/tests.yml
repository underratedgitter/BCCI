name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: npm test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Lower bound is the engines floor in package.json.
        node-version: ['18', '20']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install
        run: npm ci

      - name: Syntax check
        run: npm run check

      # The suites use a mock Upstash and a local SMTP server, so no
      # credentials and no network access are needed.
      - name: Run tests
        run: npm test
